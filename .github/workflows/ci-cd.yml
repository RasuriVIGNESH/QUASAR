name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: vignesh4354/quasar
  JAVA_VERSION: '21'

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      S3_accessKey: ${{ secrets.S3_ACCESS_KEY }}
      S3_secrectKey: ${{ secrets.S3_SECRET_KEY }}
      S3_bucketName: ${{ secrets.S3_BUCKET_NAME }}

      APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}

      GITHUB_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}

      CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
      backendURL: ${{ secrets.BACKEND_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend/peerConnect/pom.xml

      - name: Run Maven tests
        working-directory: backend/peerConnect
        run: mvn -B -ntp test

  publish-deploy:
    name: Build, publish, and deploy native image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push GraalVM native image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/peerConnect
          file: ./backend/peerConnect/Dockerfile
          push: true
          tags: |
            docker.io/${{ env.IMAGE }}:latest
            docker.io/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Trigger Render deploy with immutable image
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: docker.io/${{ env.IMAGE }}:${{ github.sha }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"

          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --get \
            --data-urlencode "imgURL=$IMAGE_URL" \
            "$RENDER_DEPLOY_HOOK_URL"
